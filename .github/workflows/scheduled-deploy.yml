# One-time scheduled deploy of the staff passcode change.
#
# At 3:00 AM Eastern on Nov 19, 2026 this moves `main` to the
# `staff-passcode` branch (Vercel then deploys the app) and deploys the
# Firestore rules, then publishes the v1.3.0 GitHub release. The last commit on that branch deletes this file, so it
# only ever runs once.
#
# It refuses to deploy while any staff account is still role 'staff'; run
# the "promote-staff" mode first, after checking who they are.
#
# Needs the repo secret FIREBASE_SERVICE_ACCOUNT (the same service account
# JSON used in Vercel). To test it without deploying: Actions → this
# workflow → Run workflow → mode "check".

name: Scheduled deploy (staff passcode)

on:
  schedule:
    - cron: '0 8 19 11 *' # 08:00 UTC = 3:00 AM Eastern (EST), Nov 19
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = test only; promote-staff = make every staff account an owner; deploy = deploy now'
        type: choice
        options: [check, promote-staff, deploy]
        default: check

permissions:
  contents: write

concurrency: staff-passcode-deploy

env:
  FIREBASE_PROJECT: studio-2882078798-8b293
  DEPLOY: ${{ (github.event_name == 'schedule' || inputs.mode == 'deploy') && 'yes' || 'no' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Only in 2026
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%Y)" != "2026" ]; then echo "::error::Stale schedule, not deploying."; exit 1; fi

      - uses: actions/checkout@v4
        with:
          ref: staff-passcode
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Firebase credentials
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::Add the FIREBASE_SERVICE_ACCOUNT repo secret first."
            exit 1
          fi
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/service-account.json" >> "$GITHUB_ENV"

      # Runs every time, so a credentials problem stops the deploy before main
      # is touched (the app must never go out without its rules).
      - name: Check the rules deploy (dry run)
        run: npx --yes firebase-tools@15.36.0 deploy --only firestore:rules --project "$FIREBASE_PROJECT" --non-interactive --dry-run

      - name: Install dependencies
        run: npm ci

      # Staff accounts keep working only as owners. Promoting is a deliberate
      # step (mode promote-staff) taken after the owner has checked who they are.
      - name: Promote staff accounts to owners
        if: inputs.mode == 'promote-staff'
        run: npx tsx scripts/promote-staff-to-owners.ts --commit

      - name: Staff accounts still to promote
        if: env.DEPLOY != 'yes'
        run: npx tsx scripts/promote-staff-to-owners.ts

      # Never go live while a staff account would lose access.
      - name: Check every staff account has been promoted
        if: env.DEPLOY == 'yes'
        run: npx tsx scripts/promote-staff-to-owners.ts --require-none

      - name: Check main can be fast-forwarded
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || {
            echo "::error::main has new commits that aren't on staff-passcode. Not deploying."
            exit 1
          }
          # The release notes live next to this workflow on main; grab them
          # before main moves to the branch (which doesn't have them).
          git show origin/main:.github/release-notes-v1.3.0.md > "$RUNNER_TEMP/release-notes.md"

      - name: Push the app to main (Vercel deploys it)
        if: env.DEPLOY == 'yes'
        run: git push origin HEAD:refs/heads/main

      - name: Deploy Firestore rules
        if: env.DEPLOY == 'yes'
        run: npx --yes firebase-tools@15.36.0 deploy --only firestore:rules --project "$FIREBASE_PROJECT" --non-interactive

      # Only once the app and rules are both out.
      - name: Publish the v1.3.0 release
        if: env.DEPLOY == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.3.0 \
            --target "$(git rev-parse HEAD)" \
            --title "v1.3.0 — Staff passcode sign-in, sessions that end themselves" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest
